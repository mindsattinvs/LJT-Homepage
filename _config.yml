locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Research in natural language processing and machine learning"
url: "https://mindsattinvs.github.io"
baseurl: "/LJT-Homepage"
repository: "mindsattinvs/LJT-Homepage"

author:
  name: "Junteng Liu"
  bio: "Ph.D. candidate at HKUST NLP Group"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

atom_feed:
  hide: true

include:
  - _pages
exclude:
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .jekyll-cache
  - .sass-cache
  - _site
  - node_modules
  - vendor
  - AGENTS.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yaml
  - package.json
  - scripts
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - files
  - _drafts
  - _posts
  - _portfolio
  - _publications
  - _talks
  - _teaching
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/cv.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html

collections:
  publications:
    output: false
  portfolio:
    output: false
  talks:
    output: false
  teaching:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
whitelist:
  - jekyll-sitemap
